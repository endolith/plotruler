[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plotruler"
version = "0.1.1"
description = "Read (X, Y) values off an on-screen graph with a translucent overlay"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "PySide6==6.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["plotruler"]

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.format]
# Match the project's plain-style code: double quotes, no magic trailing
# comma (the owner prefers a reader-followable style). These pins make the
# formatter output stable across runs so it does not churn existing code.
quote-style = "double"
indent-style = "space"
preview = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
